# Daily editorial pipeline — runs at 05:00 Bangladesh time (23:00 UTC).
# Free tier: GitHub Actions public repos have unlimited minutes;
# this run takes ~5 minutes.
name: daily-editorials

on:
  schedule:
    # 23:00 UTC == 05:00 Bangladesh time (UTC+6) on the NEXT calendar day.
    # GitHub queues scheduled runs on a best-effort basis and can start them
    # late when its schedulers are busy — sometimes by tens of minutes. That is
    # tolerable here because the app falls back to the previous day's edition
    # until new content lands, so a late run is invisible to a student.
    - cron: "0 23 * * *"
  workflow_dispatch: {}         # manual "Run workflow" button for testing

concurrency:
  group: daily-editorials
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Was 45. A healthy run takes 4-15 minutes; the only thing that ever used
    # the other 30 was Gemini back-off on a key with no quota, which now has
    # its own budget (GEMINI_SLEEP_BUDGET) and stops the run instead. Keeping
    # this tight means a genuine hang shows up as a timeout the same morning
    # rather than hiding inside a plausible-looking 45-minute job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Catches a syntax error in seconds instead of after a long crawl.
      - name: Syntax check
        run: python -m compileall -q main.py updates.py common.py sources.py update_sources.py

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional spare key, tried when the one above is out of credit or
          # allowance. Rotation retries the same article, so nothing is lost.
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          # ---- free-tier budget -------------------------------------------
          # GEMINI_MODEL is deliberately NOT set. Pinning looks like the right
          # thing — "gemini-flash-latest" is hot-swapped with every Flash
          # release, and Google's docs say latest aliases "will typically have
          # billing enabled" — but gemini-2.5-flash was tried here on
          # 2026-09-12 and is unavailable to both of these keys (it was retired
          # for new keys, as pick_model's own comment records). The pin merely
          # wasted one request per key before pick_model fell through to the
          # alias. Pin again only after checking what the key can actually
          # call, and mainly when cost matters, i.e. on a funded key.

          # Measured 2026-09-12: a free-tier key on this account serves
          # ~10-16 requests/day before Google returns a per-day 429, while
          # MAX_TOTAL=15 needed ~20 and could never finish.
          #
          # MAX_GEMINI_CALLS is NOT sized from articles. The first free-tier
          # run spent 13 requests to save 2, because Google returned eight 503s
          # and each costs three attempts. GeminiStats counts real requests, so
          # server flakiness draws on this budget. Keep it well above the
          # per-day ceiling and let Google's 429 be what stops the run — that
          # path is handled cleanly now — rather than capping ourselves early.
          #
          # Deliberate free-tier settings, not limits of the pipeline. On a
          # funded key: MAX_TOTAL 15, MAX_GEMINI_CALLS 40.
          MAX_TOTAL: "6"
          MAX_GEMINI_CALLS: "25"
        run: python main.py

  # GitHub disables scheduled workflows in a public repo after 60 days without
  # a commit — and these runs never commit. Re-enabling both workflows through
  # the API after every run resets that timer, so they never lapse. Runs even
  # if the pipeline failed; needs only `actions: write`, no commits.
  keepalive:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-enable scheduled workflows
        run: |
          for wf in main.yml updates.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "kept alive: $wf"
          done
