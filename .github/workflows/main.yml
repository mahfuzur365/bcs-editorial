# Daily editorial pipeline — runs at 05:00 Bangladesh time (23:00 UTC).
# Free tier: GitHub Actions public repos have unlimited minutes;
# this run takes ~5 minutes.
name: daily-editorials

on:
  schedule:
    # 23:00 UTC == 05:00 Bangladesh time (UTC+6) on the NEXT calendar day.
    # GitHub queues scheduled runs on a best-effort basis and can start them
    # late when its schedulers are busy — sometimes by tens of minutes. That is
    # tolerable here because the app falls back to the previous day's edition
    # until new content lands, so a late run is invisible to a student.
    - cron: "0 23 * * *"
  workflow_dispatch: {}         # manual "Run workflow" button for testing

concurrency:
  group: daily-editorials
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Was 45. A healthy run takes 4-15 minutes; the only thing that ever used
    # the other 30 was Gemini back-off on a key with no quota, which now has
    # its own budget (GEMINI_SLEEP_BUDGET) and stops the run instead. Keeping
    # this tight means a genuine hang shows up as a timeout the same morning
    # rather than hiding inside a plausible-looking 45-minute job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Catches a syntax error in seconds instead of after a long crawl.
      - name: Syntax check
        run: python -m compileall -q main.py updates.py common.py sources.py update_sources.py

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional spare key, tried when the one above is out of credit or
          # allowance. Rotation retries the same article, so nothing is lost.
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          # ---- free-tier budget -------------------------------------------
          # Pinned deliberately. "gemini-flash-latest" is hot-swapped by
          # Google with every Flash release, and their docs note that latest
          # aliases "will typically have billing enabled" — a poor fit for a
          # run that must survive on the free tier. A pinned stable model also
          # makes cost predictable if this ever moves to a paid key.
          GEMINI_MODEL: gemini-2.5-flash

          # Measured 2026-09-12: a free-tier key on this account serves
          # ~10-16 requests/day before Google returns a per-day 429, while
          # MAX_TOTAL=15 needed ~20. Green August runs averaged ~1.33 requests
          # per saved article (the gatekeeper spends one on each rejection
          # too), so 6 articles ~= 8 requests and fits with room to spare.
          #
          # This is the deliberate free-tier setting, not a limit of the
          # pipeline. Raise MAX_TOTAL back to 15 and MAX_GEMINI_CALLS to 40
          # once the key has credit; nothing else needs to change.
          MAX_TOTAL: "6"
          MAX_GEMINI_CALLS: "12"
        run: python main.py
