# Current-affairs pipeline — COLLECTS DAILY, you PUBLISH WEEKLY.
#
# Runs every morning at 05:00 Bangladesh time, alongside the editorial pipeline.
# The two can run together because they use separate Gemini keys from separate
# AI Studio projects, so neither can exhaust the other's quota.
#
# Nothing reaches students until you approve the drafts at /admin/updates — do
# that once a week, typically Friday, the app's revision day.
#
# Daily rather than one weekly run because a single run samples under 5% of the
# week's matching articles, Google News truncates a 7-day query at 100 items,
# and one failed run would lose the whole week irrecoverably. See updates.py.
name: current-affairs

on:
  schedule:
    # 23:00 UTC == 05:00 Bangladesh time (UTC+6) on the NEXT calendar day.
    # GitHub may start a scheduled run late under load; harmless here, because
    # the app keeps showing the previous content until the new batch arrives.
    - cron: "0 23 * * *"
  workflow_dispatch:            # manual "Run workflow" button
    inputs:
      max_items:
        description: "Maximum drafts to save this run"
        required: false
        default: "5"
      min_score:
        description: "Exam-relevance bar, 0-10 (higher = stricter)"
        required: false
        default: "6"

concurrency:
  group: current-affairs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Catches a syntax error in seconds instead of after a 40-minute crawl.
      - name: Syntax check
        run: python -m compileall -q main.py updates.py common.py sources.py update_sources.py

      - name: Run current-affairs pipeline
        env:
          # Its own key, so a Friday run cannot be starved by the daily
          # editorial pipeline's quota. Falls back to the shared key until the
          # UPDATES_GEMINI_API_KEY secret exists — mint it in a SEPARATE AI
          # Studio project, since free-tier quota is metered per project.
          UPDATES_GEMINI_API_KEY: ${{ secrets.UPDATES_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          UPDATES_MAX_ITEMS: ${{ inputs.max_items || '5' }}
          UPDATES_MIN_SCORE: ${{ inputs.min_score || '6' }}
        run: python updates.py
